apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// android/app/build.gradle
apply plugin: 'com.onesignal.androidsdk.onesignal-gradle-plugin'


react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.attenddyna"

    defaultConfig {
        applicationId "com.attenddyna"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // ✅ OneSignal App ID added here
        manifestPlaceholders = [
            onesignal_app_id: "8a14c7d8-4d93-4c92-9af3-8cb19f93fdd7",  // 🔁 Replace with your actual OneSignal App ID
            onesignal_google_project_number: "REMOTE"
        ]
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

allprojects {
    repositories {
        mavenLocal()
        maven {
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        maven {
            url("${project(':react-native-background-fetch').projectDir}/libs")
        }
        maven {
            url 'https://plugins.gradle.org/m2/' // ✅ Required for OneSignal
        }
        google() // ✅ Make sure Google repo is added
        mavenCentral()
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-vector-icons')

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

   implementation 'com.onesignal:OneSignal:4.5.4'
 // ✅ Add OneSignal SDK
}

apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
